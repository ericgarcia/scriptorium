name: tests

# The framework's own regression suite. It runs against the FIXTURE corpus in
# tools/fixtures/pieces/, because the real corpus lives in a private instance repo —
# and the code these tests guard (the converter, the ProseMirror patcher) lives here,
# so this is where they have to run.
#
# The suite makes no network calls and drives no browser. It therefore checks that a
# draft matches its sealed baseline; it CANNOT check a draft against a live Substack
# post. That comparison needs an authenticated browser session and stays a human-run
# `substack_sync scan`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Show versions
        run: python3 --version && node --version

      # The tools' packages, from the same file the pre-push hook builds its venv from,
      # so a dependency cannot be present on one side and missing on the other.
      - name: Install the CI requirements
        run: python3 -m pip install -r requirements-ci.txt

      # The no-deletion guard, the suite, and the read-only check, as ONE command shared
      # with the pre-push hook (tools/prepush.py) so the two cannot drift. See ci_check.py.
      - name: CI checks (guard, suite, read-only)
        run: python3 tools/ci_check.py
